<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAI Guest Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#f6f6f3;color:#151515;margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:30px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.card{background:white;border:1px solid #ddd;padding:16px;border-radius:12px}.num{font-size:28px;font-weight:bold}.controls{display:flex;gap:8px;margin:15px 0}input,select,button{padding:11px;border:1px solid #ccc;border-radius:8px;background:white}input{flex:1}button{cursor:pointer}.primary{background:#111;color:white}table{width:100%;border-collapse:collapse;background:white}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left}th{font-size:12px}.yes{color:#18794e}.no{color:#b42318}.pending{color:#8a6116}.err{display:none;background:#fee;border:1px solid #eaa;padding:10px;border-radius:8px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.wrap{padding:15px}}</style></head><body><div class="wrap"><div class="top"><div><h1>KAI Guest Manager</h1><div>Internal testing</div></div><button class="primary" onclick="addGuest()">+ Add Guest</button></div><div id="err" class="err"></div><div class="stats"><div class="card">Total<div class="num" id="total">...</div></div><div class="card">Confirmed<div class="num" id="confirmed">...</div></div><div class="card">Pending<div class="num" id="pending">...</div></div><div class="card">Declined<div class="num" id="declined">...</div></div></div><div class="controls"><input id="search" placeholder="Search name or phone..."><select id="filter"><option value="">All RSVP</option><option>YES</option><option>PENDING</option><option>NO</option></select></div><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Phone</th><th>RSVP</th><th>Persons</th><th>Notes</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div><script>const URL='https://jnbzajhpknowdghajgkh.supabase.co',KEY='sb_publishable_UBoZAVcLA8rCP5mQ_ns9BA__qbNS0kK',db=window.supabase.createClient(URL,KEY);let G=[];const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function showErr(x){err.style.display='block';err.textContent=x}async function load(){const r=await db.from('guests').select('*').order('name');if(r.error)return showErr(r.error.message);G=r.data||[];render()}function render(){const q=search.value.toLowerCase(),f=filter.value,a=G.filter(x=>(!f||x.rsvp===f)&&(!q||(x.name||'').toLowerCase().includes(q)||(x.phone||'').toLowerCase().includes(q)));rows.innerHTML=a.map(x=>'<tr><td><b>'+E(x.name)+'</b></td><td>'+E(x.phone)+'</td><td class="'+String(x.rsvp).toLowerCase()+'">'+E(x.rsvp)+'</td><td>'+Number(x.persons||0)+'</td><td>'+E(x.notes)+'</td><td><button onclick="editGuest('+x.id+')">Edit</button></td></tr>').join('');total.textContent=G.reduce((a,x)=>a+(+x.persons||0),0);confirmed.textContent=G.filter(x=>x.rsvp==='YES').reduce((a,x)=>a+(+x.persons||0),0);pending.textContent=G.filter(x=>x.rsvp==='PENDING').reduce((a,x)=>a+(+x.persons||0),0);declined.textContent=G.filter(x=>x.rsvp==='NO').reduce((a,x)=>a+(+x.persons||0),0)}async function addGuest(){const name=prompt('Guest name');if(!name)return;const persons=Number(prompt('Persons','1'))||1;const r=await db.from('guests').insert({name,persons,rsvp:'PENDING',source:'Web'});if(r.error)return showErr(r.error.message);load()}async function editGuest(id){const g=G.find(x=>x.id===id),v=prompt('RSVP: YES / NO / PENDING',g.rsvp);if(!v)return;const s=v.toUpperCase();if(!['YES','NO','PENDING'].includes(s))return alert('Invalid RSVP');const r=await db.from('guests').update({rsvp:s}).eq('id',id);if(r.error)return showErr(r.error.message);load()}search.oninput=render;filter.onchange=render;load()</script></body></html>
