<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAI Guest Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{font-family:Arial,sans-serif;background:#f6f6f3;color:#151515;margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1{font-size:30px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.card{background:white;border:1px solid #ddd;padding:16px;border-radius:12px}.num{font-size:28px;font-weight:bold}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}input,select,button{padding:11px;border:1px solid #ccc;border-radius:8px;background:white}input[type=search]{flex:1;min-width:220px}button{cursor:pointer}.primary{background:#111;color:white}table{width:100%;border-collapse:collapse;background:white}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left}th{font-size:12px;text-transform:uppercase}.yes{color:#18794e}.no{color:#b42318}.pending{color:#8a6116}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}.box{background:white;padding:22px;border-radius:14px;width:min(420px,90%)}.box input,.box select{width:100%;box-sizing:border-box;margin:5px 0 12px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.wrap{padding:15px}table{font-size:13px}.hideMob{display:none}}</style></head><body><div class="wrap"><div class="top"><div><h1>KAI Guest Manager</h1><div>Internal testing</div></div><div><button onclick="document.getElementById('file').click()">Import Excel</button> <button class="primary" onclick="openForm()">+ Add Guest</button><input id="file" type="file" accept=".xlsx,.xls" hidden onchange="importExcel(this.files[0])"></div></div><div class="stats"><div class="card"><div>Total</div><div class="num" id="total">0</div></div><div class="card"><div>Confirmed</div><div class="num" id="confirmed">0</div></div><div class="card"><div>Pending</div><div class="num" id="pending">0</div></div><div class="card"><div>Declined</div><div class="num" id="declined">0</div></div></div><div class="controls"><input type="search" id="search" placeholder="Search name or phone..." oninput="render()"><select id="filter" onchange="render()"><option value="">All RSVP</option><option>YES</option><option>PENDING</option><option>NO</option></select></div><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Phone</th><th>RSVP</th><th>Persons</th><th class="hideMob">Notes</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="modal" id="modal"><div class="box"><h2 id="formTitle">Guest</h2><input id="gid" type="hidden"><label>Name</label><input id="name"><label>Phone</label><input id="phone"><label>RSVP</label><select id="rsvp"><option>PENDING</option><option>YES</option><option>NO</option></select><label>Persons</label><input id="persons" type="number" min="0" value="1"><label>Notes</label><input id="notes"><button class="primary" onclick="saveGuest()">Save</button> <button onclick="closeForm()">Cancel</button></div></div><script>const URL='https://jnbzajhpknowdghajgkh.supabase.co',KEY='sb_publishable_UBoZAVcLA8rCP5mQ_ns9BA__qbNS0kK';const sb=supabase.createClient(URL,KEY);let guests=[];async function load(){let {data,error}=await sb.from('guests').select('*').order('name');if(error)return alert(error.message);guests=data||[];render()}function render(){let q=search.value.toLowerCase(),f=filter.value;let a=guests.filter(g=>(!f||g.rsvp===f)&&(!q||(g.name||'').toLowerCase().includes(q)||(g.phone||'').toLowerCase().includes(q)));rows.innerHTML=a.map(g=>`<tr><td><b>${esc(g.name)}</b></td><td>${esc(g.phone||'')}</td><td class="${(g.rsvp||'pending').toLowerCase()}">${g.rsvp||'PENDING'}</td><td>${g.persons||0}</td><td class="hideMob">${esc(g.notes||'')}</td><td><button onclick="edit(${g.id})">Edit</button> <button onclick="del(${g.id})">×</button></td></tr>`).join('');total.textContent=guests.reduce((s,g)=>s+(+g.persons||0),0);confirmed.textContent=guests.filter(g=>g.rsvp==='YES').reduce((s,g)=>s+(+g.persons||0),0);pending.textContent=guests.filter(g=>g.rsvp==='PENDING').reduce((s,g)=>s+(+g.persons||0),0);declined.textContent=guests.filter(g=>g.rsvp==='NO').reduce((s,g)=>s+(+g.persons||0),0)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function openForm(){gid.value='';name.value='';phone.value='';rsvp.value='PENDING';persons.value=1;notes.value='';modal.style.display='flex'}function closeForm(){modal.style.display='none'}function edit(id){let g=guests.find(x=>x.id===id);gid.value=g.id;name.value=g.name||'';phone.value=g.phone||'';rsvp.value=g.rsvp||'PENDING';persons.value=g.persons||0;notes.value=g.notes||'';modal.style.display='flex'}async function saveGuest(){let x={name:name.value.trim(),phone:phone.value.trim()||null,rsvp:rsvp.value,persons:+persons.value||0,notes:notes.value.trim()||null,source:'Web'};if(!x.name)return alert('Name required');let error;if(gid.value)({error}=await sb.from('guests').update(x).eq('id',gid.value));else({error}=await sb.from('guests').insert(x));if(error)return alert(error.message);closeForm();load()}async function del(id){if(!confirm('Delete guest?'))return;let {error}=await sb.from('guests').delete().eq('id',id);if(error)return alert(error.message);load()}async function importExcel(file){if(!file)return;let b=await file.arrayBuffer(),wb=XLSX.read(b),ws=wb.Sheets[wb.SheetNames[0]],data=XLSX.utils.sheet_to_json(ws,{defval:''});let mapped=data.map(r=>{let k=Object.keys(r),find=(words)=>k.find(x=>words.some(w=>x.toLowerCase().includes(w)));let nk=find(['name','שם']),pk=find(['phone','טלפון']),rk=find(['rsvp','status','אישור']),ck=find(['persons','guests','people','כמות']);return{name:String(r[nk]||'').trim(),phone:pk?String(r[pk]||''):null,rsvp:rk&&['YES','NO'].includes(String(r[rk]).toUpperCase())?String(r[rk]).toUpperCase():'PENDING',persons:ck?Number(r[ck])||1:1,source:'Excel Import'}}).filter(x=>x.name);if(!mapped.length)return alert('Could not find a Name column');if(!confirm(`Import ${mapped.length} rows?`))return;for(let i=0;i<mapped.length;i+=100){let {error}=await sb.from('guests').insert(mapped.slice(i,i+100));if(error)return alert(error.message)}alert('Import complete');load()}load();</script></body></html>
